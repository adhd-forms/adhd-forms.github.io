<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Privacy (owner's spec): answers live only in the page and in links after "#". No third-party
     scripts or fonts, no inline scripts, no referrer. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>ADHD Rating Forms</title>
<meta name="description" content="NICHQ Vanderbilt ADHD rating forms for parents and teachers, filled in on a phone.">
<meta name="theme-color" content="#0D0D0C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="shared.js?v=3"></script>
<style>
  /* Same tokens as Pediatric Tools. System fonts only (no web fonts on this site). */
  :root {
    --page: #F4F4F5; --panel: #FFFFFF; --soft: #FAFAFA;
    --brand: #232323; --brand-text: #FFFFFF;
    --band: #232323; --band-text: #FFFFFF; --band-muted: #A1A1AA;
    --heading: #18181B; --body: #52525B; --border: #E4E4E7; --subtle: #F2F2F2;
    --warn-bg: #FEF2F2; --warn-border: #FCA5A5; --warn-text: #7F1D1D;
    --focus: #161616; --radius: 4px;
    --serif: Georgia, "Times New Roman", serif;
    --sans: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #141413; --panel: #1C1B19; --soft: #242320; --brand: #FAF9F6; --brand-text: #141413;
      --band: #0D0D0C; --band-text: #FAF9F6; --band-muted: #A8A49B; --heading: #FAF9F6; --body: #C2BEB5;
      --border: #3A3833; --subtle: #2C2B27; --warn-bg: #2A1A17; --warn-border: #7A2E26; --warn-text: #F3CFC6; --focus: #FAF9F6;
    }
  }
  :root[data-theme="dark"] {
    --page: #141413; --panel: #1C1B19; --soft: #242320; --brand: #FAF9F6; --brand-text: #141413;
    --band: #0D0D0C; --band-text: #FAF9F6; --band-muted: #A8A49B; --heading: #FAF9F6; --body: #C2BEB5;
    --border: #3A3833; --subtle: #2C2B27; --warn-bg: #2A1A17; --warn-border: #7A2E26; --warn-text: #F3CFC6; --focus: #FAF9F6;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--body); font: 16px/1.55 var(--sans); }
  strong, b { color: var(--heading); font-weight: 600; }
  a { color: var(--heading); }
  .band { background: var(--band); color: var(--band-text); }
  .band-inner { max-width: 900px; margin: 0 auto; padding: 40px 16px 32px; position: relative; }
  header.band .band-inner { padding-top: 64px; }
  .band h1 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.02em; font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.08; margin: 0 0 10px; color: var(--band-text); }
  .band .by { margin: 0; color: var(--band-muted); }
  .back { position: absolute; top: 18px; left: 16px; color: var(--band-muted); font-size: 14px; }
  .theme-toggle { position: absolute; top: 12px; right: 16px; min-height: 40px; padding: 6px 12px; font-family: var(--mono); font-size: 12px; font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase; color: var(--band-text); background: transparent; border: 1px solid var(--band-muted); border-radius: var(--radius); cursor: pointer; }
  footer.band .band-inner { padding: 28px 16px 36px; font-size: 13px; }
  footer.band p { margin: 0 0 8px; color: var(--band-muted); }
  footer.band a { color: inherit; text-underline-offset: 2px; }
  footer.band .credit { margin-top: 14px; font-size: 14px; }
  footer.band .sprite-credit { font-size: 12px; opacity: .8; }
  .pixel-heart { width: 1em; height: .86em; vertical-align: -.08em; margin: 0 .15em; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  h2 { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; color: var(--heading); margin: 0 0 10px; letter-spacing: -0.01em; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .btn { font: inherit; font-weight: 600; font-size: 16px; border-radius: var(--radius); padding: 10px 20px; min-height: 48px; border: 1px solid var(--brand);
    background: var(--brand); color: var(--brand-text); cursor: pointer; }
  .btn.secondary { background: var(--panel); color: var(--heading); border-color: var(--border); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  #p-scan-video { display: block; width: 100%; max-width: 420px; margin-top: 12px; border-radius: var(--radius); background: #000; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  button:focus-visible, a:focus-visible, input:focus-visible, input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hint { font-size: 14.5px; margin: 6px 0 0; }
  .msg { margin: 10px 0 0; color: var(--warn-text); min-height: 1.4em; }
  [hidden] { display: none !important; }
  label.field { display: block; margin: 14px 0 6px; color: var(--heading); }
  input[type=text] { font: inherit; font-family: var(--mono); font-size: 20px; letter-spacing: .08em; text-transform: uppercase; width: 100%; max-width: 280px;
    min-height: 48px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--soft); color: var(--heading); }

  /* choice pills (radio inputs styled as buttons) */
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices label { display: flex; align-items: center; min-height: 48px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--soft); cursor: pointer; color: var(--heading); line-height: 1.3; }
  .choices input:checked + label { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
  fieldset { border: 0; padding: 0; margin: 16px 0 0; } legend { color: var(--heading); margin-bottom: 8px; padding: 0; }

  /* one question per screen */
  .bar { height: 8px; background: var(--subtle); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--brand); width: 0; transition: width .2s; }
  .progress { font-family: var(--mono); font-size: 13px; margin: 8px 0 0; }
  .section-line { font-size: 14.5px; margin: 14px 0 4px; }
  .qtext { font-family: var(--serif); font-size: 1.45rem; line-height: 1.3; color: var(--heading); margin: 6px 0 0; }
  .qhead { height: 12rem; overflow: hidden; margin-bottom: 14px; }
  .wide-btn { width: 100%; }
  .bottom-link { margin: 14px 0 0; font-size: 14.5px; }
  .qtext:focus { outline: none; }
  .answers { display: grid; gap: 10px; }
  .answers button { font: inherit; font-size: 18px; text-align: left; min-height: 56px; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--soft); color: var(--heading); cursor: pointer; }
  .answers button.picked { background: var(--brand); color: var(--brand-text); border-color: var(--brand); }
  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }

  /* review */
  .review-list { list-style: none; margin: 12px 0 0; padding: 0; }
  .review-list button { font: inherit; width: 100%; text-align: left; display: grid; grid-template-columns: 2.4em 1fr; gap: 4px 8px; padding: 10px 8px; min-height: 48px;
    background: transparent; border: 0; border-bottom: 1px solid var(--border); color: var(--body); cursor: pointer; }
  .review-list .n { font-family: var(--mono); font-size: 13px; color: var(--heading); padding-top: 2px; }
  .review-list .a { grid-column: 2; color: var(--heading); }
  .review-list .skipped { background: var(--warn-bg); }
  .review-list .skipped .a { color: var(--warn-text); }
  .review-head { margin: 4px 0 0; }
  .review-head.warn { color: var(--warn-text); }

  /* done */
  .code { font-family: var(--mono); font-size: clamp(1.15rem, 5.4vw, 1.6rem); letter-spacing: .04em; color: var(--heading); overflow-wrap: anywhere;
    background: var(--soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin: 6px 0; user-select: all; }
  .link { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; margin: 8px 0 0; }
  .visit { font-family: var(--mono); color: var(--heading); }

  /* packet checklist and sharing */
  .rows { list-style: none; margin: 8px 0 0; padding: 0; }
  .rows li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .rows .who { color: var(--heading); }
  .rows .done::before { content: "✓ "; }
  .rows .btn { min-height: 44px; padding: 8px 14px; }
  .steps { margin: 12px 0 0; padding: 10px 12px; border-left: 3px solid var(--brand); color: var(--heading); }
  input.wide { max-width: 100%; font-size: 16px; letter-spacing: .02em; text-transform: none; }
  .qr { background: #FFFFFF; display: inline-block; padding: 0; line-height: 0; border: 1px solid var(--border); border-radius: var(--radius); }
  .qr svg { width: min(78vw, 320px); height: auto; display: block; shape-rendering: crispEdges; }
  #print-sheet { display: none; }

  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
  @media print {
    :root, :root[data-theme="dark"], :root[data-theme="light"], :root:not([data-theme="light"]) {
      --page:#FFF; --panel:#FFF; --soft:#FFF; --subtle:#EEE; --heading:#000; --body:#222; --border:#999; --band:#FFF; --band-text:#000; --band-muted:#333;
      --brand:#000; --brand-text:#FFF;
    }
    .theme-toggle, .back, .noprint { display: none !important; }
    /* "Print or save PDF": only the result sheet */
    body.print-result header, body.print-result main, body.print-result footer { display: none !important; }
    body.print-result #print-sheet { display: block; padding: 24px; text-align: center; color: #000; }
    #print-sheet .qr svg { width: 70mm; margin: 0 auto; }
    #print-sheet .code { font-size: 18pt; }
  }
</style>
</head>
<body>
<header class="band">
  <div class="band-inner">
    <a class="back" href="https://christianrada-do.github.io/peds-tools/">← Pediatric Tools</a>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark mode"></button>
    <h1>ADHD Rating Forms</h1>
    <p class="by">By Dr. Christian Rada, DO · For parents and teachers</p>
  </div>
</header>

<main class="wrap">
  <p class="msg" id="top-msg" role="status" aria-live="polite"></p>

  <section class="card" id="s-start" hidden>
    <h2 data-t="startTitle"></h2>
    <p data-t="startIntro"></p>
    <label class="field" for="code-in" data-t="startCode"></label>
    <input type="text" id="code-in" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" inputmode="text">
    <p class="hint" data-t="startCodeHint"></p>
    <fieldset class="choices" id="kind-pick"><legend data-t="startKind"></legend></fieldset>
    <fieldset class="choices" id="who-pick"><legend data-t="startWho"></legend></fieldset>
    <p class="msg" id="start-msg" role="alert"></p>
    <div class="btns"><button type="button" class="btn" id="start-go" data-t="startGo"></button></div>
    <p class="hint" data-t="startTeacherNote"></p>
  </section>

  <section class="card" id="s-setup" hidden>
    <p id="setup-who"></p>
    <h2 id="setup-title"></h2>
    <p id="setup-directions"></p>
    <div id="teacher-setup">
      <fieldset class="choices" id="role-pick"><legend data-t="setupRole"></legend></fieldset>
      <fieldset class="choices" id="time-pick"><legend data-t="setupTime"></legend></fieldset>
    </div>
    <fieldset class="choices" id="med-pick"><legend id="med-legend"></legend></fieldset>
    <p class="msg" id="setup-msg" role="alert"></p>
    <div class="btns">
      <button type="button" class="btn" id="setup-go" data-t="setupStart"></button>
      <button type="button" class="btn secondary" id="setup-back" data-t="backToPacket" hidden></button>
    </div>
  </section>

  <section class="card" id="s-question" hidden>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <p class="progress" id="progress"></p>
    <!-- Fixed height, so the answer buttons start at the same place on every question (owner, 2026-10-23) -->
    <div class="qhead" id="qhead">
      <p class="section-line" id="section-line"></p>
      <p class="qtext" id="qtext" tabindex="-1"></p>
    </div>
    <div class="answers" id="answers"></div>
    <div class="nav">
      <button type="button" class="btn secondary" id="q-back" data-t="back"></button>
      <button type="button" class="btn secondary" id="q-skip" data-t="skip"></button>
    </div>
    <div class="btns"><button type="button" class="btn secondary wide-btn" id="q-summary" data-t="summaryButton"></button></div>
  </section>

  <section class="card" id="s-review" hidden>
    <h2 data-t="reviewTitle"></h2>
    <p class="review-head" id="review-head"></p>
    <ul class="review-list" id="review-list"></ul>
    <p class="msg" id="review-msg" role="alert"></p>
    <div class="btns"><button type="button" class="btn" id="review-submit" data-t="reviewSubmit"></button></div>
  </section>

  <section class="card" id="s-done" hidden>
    <h2 data-t="doneTitle"></h2>
    <p data-t="doneIntro"></p>
    <p class="visit" id="done-visit"></p>
    <div class="btns">
      <button type="button" class="btn" id="done-send" data-t="doneSendParent"></button>
      <button type="button" class="btn secondary" id="done-print" data-t="donePrint"></button>
    </div>
    <p><strong data-t="doneCode"></strong></p>
    <p class="code" id="done-code"></p>
    <p class="hint" data-t="doneCodeHint"></p>
    <div class="btns"><button type="button" class="btn secondary" id="done-copy" data-t="doneCopy"></button></div>
    <p class="link" id="done-link"></p>
  </section>

  <section class="card" id="s-packet" hidden>
    <h2 data-t="packetTitle"></h2>
    <p id="packet-intro"></p>
    <ul class="rows" id="packet-rows"></ul>
    <div class="btns">
      <button type="button" class="btn" id="packet-doctor" data-t="sendDoctor"></button>
      <button type="button" class="btn secondary" id="packet-show" data-t="showDoctor"></button>
      <button type="button" class="btn secondary" id="packet-scan" data-t="scanTeacher"></button>
    </div>
    <p class="steps" id="doctor-steps" role="status" hidden></p>
    <div id="p-scanner" hidden>
      <video id="p-scan-video" playsinline muted></video>
      <canvas id="p-scan-canvas" hidden></canvas>
      <p class="hint" data-t="scanHint"></p>
      <div class="btns"><button type="button" class="btn secondary" id="p-scan-stop" data-t="scanStop"></button></div>
    </div>
    <label class="field" for="add-in" data-t="addByCode"></label>
    <p class="hint" data-t="addByCodeHint"></p>
    <input type="text" id="add-in" class="wide" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="btns"><button type="button" class="btn secondary" id="add-go" data-t="addGo"></button></div>
    <p class="msg" id="add-msg" role="status" aria-live="polite"></p>
  </section>

  <div id="result-box" hidden>
    <div class="btns"><button type="button" class="btn" id="start-packet" data-t="startPacketHere"></button></div>
    <p class="hint"><a id="clinic-link" href="clinic.html" data-t="clinicianLink"></a></p>
  </div>

  <section class="card" id="share-panel" hidden>
    <h2 data-t="shareTitle"></h2>
    <div class="qr" id="qr-box"></div>
    <p class="link" id="share-text"></p>
    <div class="btns">
      <button type="button" class="btn secondary" id="share-copy" data-t="doneCopy"></button>
      <button type="button" class="btn secondary" id="share-close" data-t="hidePanel"></button>
    </div>
  </section>

  <div class="btns noprint"><button type="button" class="btn secondary" id="clear-all" data-t="clear"></button></div>
  <p class="bottom-link noprint"><a href="clinic.html" data-t="clinicViewLink"></a></p>
</main>

<div id="print-sheet">
  <div class="qr" id="print-qr"></div>
  <p class="code" id="print-code"></p>
  <p class="visit" id="print-visit"></p>
  <p data-t="printLine"></p>
</div>

<footer class="band">
  <div class="band-inner">
    <p><span data-t="footerQuestions"></span> <span id="attr"></span></p>
    <p id="disclaimer"></p>
    <p class="credit">Made with
      <svg class="pixel-heart" viewBox="0 0 7 6" width="14" height="12" role="img" aria-label="love" shape-rendering="crispEdges">
        <path fill="#E5484D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"/>
      </svg>
      <a href="https://claude.com/claude-code">Claude</a></p>
    <p class="sprite-credit"><a href="credits.html">Credits</a><span class="gh-link" hidden> · <a href="https://github.com/adhd-forms/adhd-forms.github.io">Source code on GitHub</a></span></p>
  </div>
</footer>

<script src="vanderbilt-forms.js?v=2"></script>
<script src="vanderbilt-score.js?v=1"></script>
<script src="vanderbilt-codes.js?v=3"></script>
<script src="vendor/qrcode-generator-2.0.4.js"></script>
<script src="vanderbilt-scan.js?v=2"></script>
<script src="vanderbilt-strings-en.js?v=4"></script>
<script src="vanderbilt-page.js?v=5"></script>
</body>
</html>
